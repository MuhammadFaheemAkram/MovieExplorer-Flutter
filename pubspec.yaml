name: movie_explorer
description: "A learning-focused Flutter movie browser: clean architecture, Bloc, drift, go_router and a fake API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.0.2
  injectable: ^3.0.0
  material_ui: ^1.6.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  injectable_generator: ^3.1.3

flutter:
  # Bundles the Material Icons font used by `Icons.*`.
  uses-material-design: true
