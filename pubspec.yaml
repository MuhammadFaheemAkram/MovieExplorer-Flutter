name: movie_explorer
description: "A learning-focused Flutter movie browser: clean architecture, Bloc, drift, go_router and a fake API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  material_ui: ^1.6.0

dev_dependencies:
  async: ^2.13.1
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.5.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  # Bundles the Material Icons font used by `Icons.*`.
  uses-material-design: true

  assets:
    # Fake-API catalog, shared verbatim with the iOS edition.
    - assets/json/
